[project]
name = "negarit-ocr"
version = "0.1.0"
description = "Reads receipt screenshots for Negarit's payment verification. See README.md."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

# Only the regression suite needs these; the image builds with --no-dev.
[dependency-groups]
dev = [
  "pillow>=10",
  "qrcode>=7",
  "requests>=2.31",
]
